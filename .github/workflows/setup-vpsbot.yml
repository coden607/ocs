name: setup-vpsbot
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: install vpsbot on VPS via SSH key
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python3 - << 'PY'
          import os, pathlib
          raw = os.environ.get("VPS_SSH_KEY", "")
          raw = raw.replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n").strip()
          if not raw:
              raise SystemExit("VPS_SSH_KEY secret is empty")
          pathlib.Path.home().joinpath(".ssh/vps_key").write_text(raw + "\n")
          PY
          chmod 600 ~/.ssh/vps_key
          echo "===== PUBLIC KEY (copy this ONE line into /root/.ssh/authorized_keys) ====="
          ssh-keygen -y -f ~/.ssh/vps_key || { echo "::error::VPS_SSH_KEY is not a valid private key (paste was mangled). Regenerate on the VPS and store the private key again."; exit 1; }
          echo "===== FINGERPRINT ====="
          ssh-keygen -lf ~/.ssh/vps_key
          echo "===== SSH ====="
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            root@134.122.113.44 \
            "VPSBOT_TOKEN='$BOT_TOKEN' VPSBOT_CHATS='$TG_CHAT_ID' bash <(curl -fsSL https://raw.githubusercontent.com/coden607/ocs/main/02-telegram.sh)"
